[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estate-research-harness"
version = "0.1.0"
description = "Evidence-first housing research agents coordinated through GitHub Issues"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
estate-harness = "estate_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/estate_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
