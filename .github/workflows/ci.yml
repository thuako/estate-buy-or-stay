name: Validate harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest ruff
      - run: ruff check src tests
      - run: pytest -q
      - run: estate-harness demo --run-id ci-demo
